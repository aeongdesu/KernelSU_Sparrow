name: modules build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - '!modules/**.md'
      - '.github/workflows/modules.yml'
  pull_request:
    paths:
      - 'modules/**'
      - '!modules/**.md'
      - '.github/workflows/modules.yml'

permissions:
  contents: read

env:
  MODULE_ROOT: modules
  RELEASE_TAG: ksu_modules
  DIST: dist

jobs:
  modules:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate modules
        run: |
          set -euo pipefail
          shopt -s nullglob
          props=("$MODULE_ROOT"/*/src/module.prop)
          [ ${#props[@]} -gt 0 ] || { echo "::error::no modules under $MODULE_ROOT/*/src"; exit 1; }

          manifest="$RUNNER_TEMP/modules.tsv"
          : > "$manifest"

          declare -A seen=()
          for prop in "${props[@]}"; do
            src=$(dirname "$prop")
            dir=$(dirname "$src")
            id=$(sed -n 's/^id=//p' "$prop" | head -n1)
            code=$(sed -n 's/^versionCode=//p' "$prop" | head -n1)

            [ -n "$id" ] || { echo "::error file=$prop::missing id"; exit 1; }
            [ -n "$code" ] || { echo "::error file=$prop::missing versionCode"; exit 1; }

            if grep -qP '\r' "$prop"; then
              echo "::error file=$prop::CRLF line endings"
              exit 1
            fi

            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                id=* | name=* | version=* | versionCode=* | author=* | description=* | updateJson=* | actionIcon=* | webuiIcon=*) ;;
                *) echo "::error file=$prop::unexpected line: $line"; exit 1 ;;
              esac
            done < "$prop"

            printf '%s' "$id" | grep -Eq '^[a-zA-Z][a-zA-Z0-9._-]+$' ||
              { echo "::error::invalid module id: $id"; exit 1; }

            [ "$(basename "$dir")" = "$id" ] ||
              { echo "::error::directory $(basename "$dir") does not match id=$id"; exit 1; }

            [ -z "${seen[$id]:-}" ] ||
              { echo "::error::duplicate module id: $id"; exit 1; }
            seen[$id]=1

            if [ -f "$src/customize.sh" ] &&
              grep -Eq '(^|&&|;)[[:space:]]*exit([[:space:]]|$)' "$src/customize.sh"; then
              echo "::error file=$src/customize.sh::must not call exit (the file is sourced)"
              exit 1
            fi

            for f in "$src"/*.sh; do
              sh -n "$f" || { echo "::error file=$f::shell syntax error"; exit 1; }
            done

            printf '%s\t%s\n' "$id" "$src" >> "$manifest"
            echo "ok: $id"
          done

      - name: Build module ZIPs
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p "$DIST"

          while IFS=$'\t' read -r id src; do
            [ -n "$id" ] || continue
            zip_path="$GITHUB_WORKSPACE/$DIST/$id.zip"

            find "$src" -type f -name '*.sh' -exec chmod 0755 {} +
            find "$src" -type f ! -name '*.sh' -exec chmod 0644 {} +

            (cd "$src" && zip -q -X -r "$zip_path" . -x '.*' -x '*/.*' -x '__MACOSX/*')

            unzip -tq "$zip_path" >/dev/null
            if unzip -Z1 "$zip_path" | grep -qE '/module\.prop$'; then
              echo "::error::module.prop must be at the ZIP root, not in a subdirectory"
              exit 1
            fi
            unzip -Z1 "$zip_path" | grep -qx 'module.prop' ||
              { echo "::error::missing module.prop at ZIP root"; exit 1; }

            echo "built: $DIST/$id.zip"
          done < "$RUNNER_TEMP/modules.tsv"

          ls -l "$DIST"

      - uses: actions/upload-artifact@v7
        with:
          name: modules
          path: dist/*.zip
          archive: false
          if-no-files-found: error

      - uses: actions/attest@v4
        if: github.event_name != 'pull_request'
        with:
          subject-path: dist/*.zip

      - uses: softprops/action-gh-release@v3
        if: github.event_name != 'pull_request'
        with:
          tag_name: ksu_modules
          name: modules
          target_commitish: ${{ github.sha }}
          body: |
            Module builds from ${{ github.sha }}
          files: dist/*.zip
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: false

      - name: Prune removed modules
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          zips=("$GITHUB_WORKSPACE/$DIST"/*.zip)
          [ ${#zips[@]} -gt 0 ] || { echo "::error::no built ZIPs to publish"; exit 1; }
          keep=$(printf '%s\n' "${zips[@]}" | xargs -n1 basename | sort)

          have=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort)

          stale=$(comm -13 <(printf '%s\n' "$keep") <(printf '%s\n' "$have") || true)
          if [ -z "$stale" ]; then
            echo "nothing to prune"
            exit 0
          fi

          while IFS= read -r name; do
            [ -n "$name" ] || continue
            echo "pruning $name"
            gh release delete-asset "$RELEASE_TAG" "$name" \
              --repo "$GITHUB_REPOSITORY" --yes
          done <<< "$stale"
